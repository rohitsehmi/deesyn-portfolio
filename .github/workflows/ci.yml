name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Verify design system
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 24, not 22. Local development, the lockfile and every green run of these
      # checks are on 24; CI was the only thing on 22, and it had been failing at
      # `npm ci` on every push since 2026-08-05 while the checks themselves passed
      # locally. Pinning both sides to one major removes the whole class of drift.
      # If this needs to move, move .nvmrc with it.
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      # `npm install`, not `npm ci`, and this is a deliberate trade rather than
      # sloppiness. `npm ci` refused on every push from 2026-08-05 with
      # "Missing: @emnapi/runtime@1.11.3 from lock file". @emnapi/* are the WASM
      # Node-API shims that @napi-rs/wasm-runtime needs; on macOS npm resolves
      # sharp's native darwin binary and never walks that optional branch, so a
      # lockfile generated here cannot contain the entries a Linux install
      # demands. Neither --os/--cpu flags nor npm config coerce it, and there is
      # no Linux machine in the loop to regenerate on.
      #
      # The lockfile is still committed and still the starting point; `install`
      # simply repairs the platform branch instead of refusing. Vercel does its
      # own install for the real build, so what is traded is strict resolution
      # in a checks-only pipeline -- against fifteen runs where no check ran at
      # all. Move back to `npm ci` the day the lockfile is generated on Linux.
      - run: npm install --no-audit --no-fund

      # Nothing else here reads TypeScript. `astro build` transpiles without
      # checking, and Storybook renders a story whose props no longer exist
      # rather than failing — which is how three stale `band` props on Parallax
      # survived the change that removed the prop.
      - name: Types
        run: npm run typecheck

      # This repo is public, so a committed token is harvested in minutes and
      # the only cheap moment to catch one is before the push. Scans tracked
      # files only -- .env is gitignored and holds the real token, and flagging
      # it would train everyone to ignore this check.
      - name: Secrets — no credentials in tracked files
        run: node design/verify-secrets.mjs

      # These are the checks that stop Figma and code drifting apart. Both exit
      # non-zero on failure, so a renamed or deleted token breaks the build
      # rather than quietly producing a component that references nothing.
      - name: Tokens — checksum and alias integrity
        run: node tokens/verify.mjs
      - name: Components — token integrity, no literals, checksum
        run: node design/verify.mjs
      - name: CSS — token references resolve, font values bound
        run: node design/verify-css.mjs

      # /how-this-was-built states "N in code, M with a published contract".
      # Those two numbers used to be counted from different things and agreed by
      # coincidence; this fails the build if any component loses its contract,
      # so the page cannot quietly start making a false claim about itself.
      - name: Contracts — every component has one
        run: node design/verify-contracts.mjs

      # Regenerating must be a no-op. If it is not, someone hand-edited a
      # generated file instead of changing Figma and re-exporting.
      - name: Generated files are up to date
        run: |
          npm run tokens
          npm run specs
          git diff --exit-code -- src/styles/tokens.css tokens/tokens.json \
            icons/ marks/ components/ public/ \
            || (echo "::error::Generated files are stale — run npm run tokens && npm run specs" && exit 1)

      - run: npx astro build

      # Lints the built pages against the adjacency rules in
      # docs/banding-system.md §3, on the output rather than the source so
      # conditionally rendered bands are checked too.
      - name: Bands — adjacency rules
        run: node design/verify-bands.mjs

      # [NEEDS: …] markers are deliberately rendered on the page rather than
      # hidden in a comment, so a missing fact cannot be lost. The cost is that
      # nothing stopped one shipping — this is what stops one shipping.
      #
      # Reads dist/ rather than src/copy/, which is why it sits after the build
      # beside the band linter rather than in `npm run verify`: a marker only
      # matters once an arrangement actually renders it. Archived studies are
      # reported but do not fail, being off the index and out of the rotation.
      - name: Gaps — no [NEEDS:] marker on a live page
        run: node design/verify-gaps.mjs

  chromatic:
    name: Visual regression
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # Chromatic needs history to detect changes
      # 24, not 22. Local development, the lockfile and every green run of these
      # checks are on 24; CI was the only thing on 22, and it had been failing at
      # `npm ci` on every push since 2026-08-05 while the checks themselves passed
      # locally. Pinning both sides to one major removes the whole class of drift.
      # If this needs to move, move .nvmrc with it.
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      # `npm install`, not `npm ci`, and this is a deliberate trade rather than
      # sloppiness. `npm ci` refused on every push from 2026-08-05 with
      # "Missing: @emnapi/runtime@1.11.3 from lock file". @emnapi/* are the WASM
      # Node-API shims that @napi-rs/wasm-runtime needs; on macOS npm resolves
      # sharp's native darwin binary and never walks that optional branch, so a
      # lockfile generated here cannot contain the entries a Linux install
      # demands. Neither --os/--cpu flags nor npm config coerce it, and there is
      # no Linux machine in the loop to regenerate on.
      #
      # The lockfile is still committed and still the starting point; `install`
      # simply repairs the platform branch instead of refusing. Vercel does its
      # own install for the real build, so what is traded is strict resolution
      # in a checks-only pipeline -- against fifteen runs where no check ran at
      # all. Move back to `npm ci` the day the lockfile is generated on Linux.
      - run: npm install --no-audit --no-fund
      # Skip rather than fail when the token is absent. A missing optional
      # credential is a configuration gap, not a regression, and a permanently
      # red badge from one trains everyone to ignore the badge. The job runs the
      # moment CHROMATIC_PROJECT_TOKEN exists in repository secrets.
      - id: token
        env:
          T: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
        run: |
          if [ -n "$T" ]; then echo "present=true" >> "$GITHUB_OUTPUT"
          else echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CHROMATIC_PROJECT_TOKEN is not set — visual regression did not run."
          fi

      - uses: chromaui/action@latest
        if: steps.token.outputs.present == 'true'
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          buildScriptName: build-storybook
          exitZeroOnChanges: true
